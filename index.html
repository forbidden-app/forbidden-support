<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Support page for Forbidden! — the iOS party word game.">
  <title>Forbidden! — Support</title>
  <style>
    :root {
      --primary: #FF7A3D;
      --accent: #B52640;
      --bg: #FFF5DC;
      --surface: #FFFFFF;
      --text: #2D2D2D;
      --text-muted: #8A8A8A;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--surface);
      max-width: 560px;
      width: 100%;
      padding: 48px 40px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(58, 36, 16, 0.08);
    }
    .brand {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
      margin: 0 0 4px;
      letter-spacing: -0.02em;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 24px;
      color: var(--text);
    }
    p {
      margin: 0 0 16px;
      font-size: 16px;
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { text-decoration: underline; }
    .email {
      display: inline-block;
      background: var(--bg);
      padding: 12px 20px;
      border-radius: 12px;
      font-family: -apple-system-mono, "SF Mono", Menlo, monospace;
      font-size: 16px;
      margin: 8px 0 24px;
    }
    .footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--bg);
      font-size: 14px;
      color: var(--text-muted);
    }
    .footer a { color: var(--text-muted); }
  </style>
</head>
<body>
  <main class="card">
    <p class="brand">Forbidden!</p>
    <h1>Support</h1>
    <p>For questions, bug reports, or feedback, email us at:</p>
    <p><a href="mailto:yasin.kbas12@gmail.com" class="email">yasin.kbas12@gmail.com</a></p>
    <p>We typically reply within 48 hours.</p>
    <div class="footer">
      <p>See also: <a href="privacy.html">Privacy Policy</a></p>
    </div>
  </main>
</body>
</html>
